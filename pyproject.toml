[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lsdrag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "requests", "pillow", "tiktoken", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

