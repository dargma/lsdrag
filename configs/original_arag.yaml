# Native upstream text-only reproduction mode; separate from B0/V1/V2/C1.
# Set ARAG_API_KEY, ARAG_BASE_URL and ARAG_MODEL in the environment.
llm:
  temperature: 0.0
  max_tokens: 16384
  reasoning_effort: medium
embedding:
  model: Qwen/Qwen3-Embedding-0.6B
  device: cuda:0
  batch_size: 16
agent:
  max_loops: 15
  max_token_budget: 128000
  verbose: false
data:
  chunks_file: data/chunks.json
  questions_file: data/questions.json
  index_dir: data/index
output:
  results_dir: results/
